<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于 - 我的博客</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <h1 class="logo"><a href="index.html" style="color: inherit;">我的博客</a></h1>
            <nav class="nav">
                <a href="index.html" class="nav-link">首页</a>
                <a href="about.html" class="nav-link active">关于</a>
            </nav>
        </div>
    </header>

    <main class="container main-content">
        <div style="max-width: 640px; margin: 0 auto;">
            <h2 style="font-size: 24px; margin-bottom: 20px;">关于我</h2>

            <div class="article-card" style="margin-bottom: 20px;">
                <p class="sidebar-text" style="font-size: 15px;">
                    你好！我是信息工程专业的一名大二学生。这个博客是我的第一个 Web 开发练手项目。
                </p>
            </div>

            <div class="article-card" style="margin-bottom: 20px;">
                <h3 class="sidebar-title">为什么做这个博客？</h3>
                <p class="sidebar-text" style="font-size: 15px;">
                    我想通过实际项目来扩展课外的技术知识，提升动手能力。博客是一个非常好的入门项目——它涵盖了前端开发的核心知识，而且做完之后可以一直用下去。
                </p>
            </div>

            <div class="article-card" style="margin-bottom: 20px;">
                <h3 class="sidebar-title">技术栈</h3>
                <div class="tag-cloud" style="margin-top: 10px;">
                    <span class="tag">HTML5</span>
                    <span class="tag">CSS3</span>
                    <span class="tag">JavaScript</span>
                    <span class="tag">Git</span>
                    <span class="tag">GitHub Pages</span>
                </div>
            </div>

            <div class="article-card">
                <h3 class="sidebar-title">联系方式</h3>
                <p class="sidebar-text" style="font-size: 15px;">
                    GitHub: <a href="#">你的GitHub用户名</a><br>
                    Email: 你的邮箱@example.com
                </p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 我的博客 · 由 GitHub Pages 提供托管</p>
        </div>
    </footer>

    <button id="back-to-top" class="back-to-top" title="回到顶部">↑</button>

    <script src="js/main.js"></script>
</body>
</html>
